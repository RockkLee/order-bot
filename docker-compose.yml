services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${BLUEPRINT_DB_DATABASE:-blueprint}
      POSTGRES_USER: ${BLUEPRINT_DB_USERNAME:-melkey}
      POSTGRES_PASSWORD: ${BLUEPRINT_DB_PASSWORD:-password1234}
    ports:
      - "${BLUEPRINT_DB_PORT:-5432}:5432"
    volumes:
      - psql_volume_bp:/var/lib/postgresql

  order-bot-mgmt-svc:
    build:
      context: ./order-bot-mgmt-svc
      dockerfile: Dockerfile
    depends_on:
      - postgres
    env_file:
      - ./order-bot-mgmt-svc/.env
    environment:
      BLUEPRINT_DB_HOST: postgres
    ports:
      - "${MGMT_PORT:-8080}:8080"

  order-bot-svc:
    build:
      context: ./order-bot-svc
      dockerfile: Dockerfile
    depends_on:
      - postgres
    env_file:
      - ./order-bot-svc/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://melkey:password1234@postgres:5432/blueprint}
      SEED_MENU: ${SEED_MENU:-false}
    ports:
      - "${ORDER_BOT_PORT:-8000}:8000"

volumes:
  psql_volume_bp:
